<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TECNA</title><style>html,body{margin:0;background:#050a12;color:#fff;font-family:system-ui}#load{min-height:100vh;display:grid;place-items:center;text-align:center}.spin{font-size:2rem}</style></head><body><div id="load"><div><div class="spin">⚡</div><b>TECNA 遊戲載入中...</b></div></div><script>(async()=>{try{const ps=["assets/shootout/01.txt","assets/shootout/02.txt"];const parts=await Promise.all(ps.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p);return r.text()})));const b=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<div id="load"><div>遊戲載入失敗，請重新整理頁面。<br><small>'+e+'</small></div></div>'}})();</script></body></html>
